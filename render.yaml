# ============================================================================
# Render Blueprint - https://render.com/docs/blueprint-spec
#
# Optional: you can create the same service through the dashboard instead (see
# DEPLOYING.md). This file exists so the deployment is reviewable in git rather
# than living only in someone's browser.
#
# To use it: Render Dashboard -> New -> Blueprint -> point at this repo.
# ============================================================================

services:
  - type: web
    name: brain-teaser-hub
    runtime: docker
    dockerfilePath: ./Dockerfile
    # Free sleeps after 15 minutes of inactivity, which costs a ~50s cold start
    # for the next visitor and drops in-flight play sessions (hint counts and
    # timers live in process memory). The client recovers from the latter by
    # reloading the same puzzle; the cold start is inherent to the free plan.
    # Upgrade to `starter` when either becomes a real problem.
    plan: free
    region: frankfurt # Change to the region nearest your players.
    autoDeploy: true

    # Liveness, deliberately: /healthz touches nothing external, so a Supabase
    # blip cannot make Render tear down a container that is serving fine.
    healthCheckPath: /healthz

    envVars:
      - key: NODE_ENV
        value: production

      # Render supplies the hostname of this very service. The app normalises a
      # bare host into a full https:// origin, so this works as-is.
      #
      # This value is a security control, not cosmetics: sign-in links are
      # absolute, and deriving the origin from the request Host header would let
      # an attacker have a victim's token delivered to their own domain. The
      # server refuses to boot in production without it.
      - key: PUBLIC_BASE_URL
        fromService:
          type: web
          name: brain-teaser-hub
          property: host

      # Generated by Render and never seen by a human. Rotating it signs
      # everyone out, which is exactly what you want if it ever leaks.
      - key: SESSION_SECRET
        generateValue: true

      # Also generated. Read it once from the Render dashboard to sign in at
      # /admin - do not replace it with something memorable.
      - key: ADMIN_TOKEN
        generateValue: true

      # Secrets: set these in the dashboard. `sync: false` keeps them out of git.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

      # Set to "google" only after enabling Google under
      # Supabase -> Authentication -> Providers. An advertised provider that is
      # not configured fails on click.
      - key: OAUTH_PROVIDERS
        value: ''

      # Give in-flight requests time to finish on a rolling deploy.
      - key: SHUTDOWN_GRACE_MS
        value: '15000'
